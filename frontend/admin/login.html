<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login &bull; Karen &amp; Steven Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #04225c;
      --primary-light: #1b3a7a;
      --accent-blue: #4a6984;
      --accent-lavender: #742374;
      --accent-gold: #c5a059;
      --bg-dark: #071329;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(116, 35, 116, 0.35) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(74, 105, 132, 0.35) 0%, transparent 40%),
                  linear-gradient(135deg, #04122d 0%, #081d45 50%, #030e24 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background rings */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      border: 1px dashed rgba(197, 160, 89, 0.15);
      border-radius: 50%;
      top: -150px;
      right: -150px;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      bottom: -100px;
      left: -100px;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45),
                  0 0 0 1px rgba(255, 255, 255, 0.2);
      border-top: 4px solid var(--accent-gold);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary), var(--accent-lavender));
      color: #ffffff;
      font-size: 24px;
      border-radius: 50%;
      margin-bottom: 14px;
      box-shadow: 0 8px 16px rgba(4, 34, 92, 0.25);
    }

    .brand-title {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }


    /* Alert Banner */
    .alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper svg.input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: #94a3b8;
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(74, 105, 132, 0.18);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pwd-btn:hover {
      color: #475569;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--accent-lavender) 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 18px rgba(4, 34, 92, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 26px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(4, 34, 92, 0.4);
      filter: brightness(1.05);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .footer-links {
      text-align: center;
      margin-top: 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon">💍</div>
        <h1 class="brand-title">Karen &amp; Steven</h1>
        <p class="brand-subtitle">Administrative Dashboard Portal</p>
      </div>

      <div id="alert-banner" class="alert alert-error"></div>

      <form id="login-form" method="POST" action="/admin/login">
        <div class="form-group">
          <label class="form-label" for="username">Admin Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="username" name="username" class="form-input" placeholder="Enter admin username" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Admin Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter admin password" required autocomplete="current-password" />
            <button type="button" class="toggle-pwd-btn" id="toggle-pwd-btn" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span id="btn-text">Sign In to Dashboard</span>
          <div id="btn-spinner" class="spinner" style="display: none;"></div>
        </button>
      </form>
    </div>

    <div class="footer-links">
      <a href="/" class="back-link">
        <span>&larr;</span> Back to Wedding Website
      </a>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const alertBanner = document.getElementById('alert-banner');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const togglePwdBtn = document.getElementById('toggle-pwd-btn');

    if (togglePwdBtn) {
      togglePwdBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
        } else {
          passwordInput.type = 'password';
        }
      });
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showAlert('Please enter both username and password.');
        return;
      }

      submitBtn.disabled = true;
      btnText.style.display = 'none';
      btnSpinner.style.display = 'block';

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await resp.json().catch(() => ({}));

        if (resp.ok) {
          if (data.token) {
            localStorage.setItem('wedding_admin_token', data.token);
          }
          window.location.href = '/admin/dashboard';
        } else {
          showAlert(data.error || 'Invalid credentials.');
        }
      } catch (err) {
        showAlert('Could not connect to authentication server.');
      } finally {
        submitBtn.disabled = false;
        btnText.style.display = 'inline';
        btnSpinner.style.display = 'none';
      }
    });

    function showAlert(msg) {
      alertBanner.textContent = msg;
      alertBanner.style.display = 'block';
    }
  </script>
</body>
</html>
